name: Grove daily post

on:
  schedule:
    - cron: "17 11 * * *"   # 11:17 UTC = 7:17 AM ET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Render next card in the queue
        run: python3 generate_cards.py

      - name: Commit card and queue state
        run: |
          git config user.name "grove-bot"
          git config user.email "actions@github.com"
          git add out/ posted.json
          git commit -m "Daily card $(TZ=America/Los_Angeles date +%F)" || echo "nothing new"
          for i in 1 2 3 4; do
            git push && break
            echo "push failed, retry $i in 45s"
            sleep 45
            git pull --rebase
          done

      - name: Post to Facebook and Instagram
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/out
        run: python3 post_to_meta.py
