name: Grove daily post

on:
  schedule:
        - cron: "0 11 * * *" # 11:00 UTC = 4:00 AM PDT / 7:00 AM ET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Generate today's cards
        run: python3 generate_cards.py

      - name: Commit cards to repo
        run: |
          git config user.name "grove-bot"
          git config user.email "actions@github.com"
          git add out/
          git commit -m "Daily cards $(TZ=America/Los_Angeles date +%F)" || echo "nothing new"
          git push

      - name: Post to Facebook and Instagram
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/out
        run: python3 post_to_meta.py
