<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grove Daily Card</title>
<style id="embedCss"></style>
<style>
  /* Frame for social export: 540x675 CSS px, screenshotted at 2x = 1080x1350 */
  html,body{height:100%;overflow:hidden;}
  body{padding:0 !important;display:flex;align-items:center;justify-content:center;}
  .stage{width:500px;}
  .card{max-width:500px;transform-origin:center center;}
  .site{margin-top:10px;text-align:center;font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--stone);}
  /* Plant card additions, built from the embed's own variables */
  #plantName{font-size:28px;color:var(--moss);text-shadow:0 0 22px rgba(143,174,122,.22);margin-bottom:5px;}
  .ties{margin-top:14px;font-size:14.5px;line-height:1.6;color:#cfc9bb;text-align:center;}
  .ties b{color:var(--moss);font-weight:normal;}
  .caution{margin-top:16px;padding-top:12px;border-top:1px solid var(--rule);
    font-family:'Helvetica Neue',Arial,sans-serif;font-size:11.5px;line-height:1.5;
    color:var(--stone);text-align:center;}
  .caution b{color:#c9a227;font-weight:normal;letter-spacing:.08em;text-transform:uppercase;font-size:10.5px;}
</style>
</head>
<body>
  <div class="stage">
  <main class="card">
    <div class="kicker" id="kicker"></div>
    <div class="date" id="date"></div>

    <section class="panel active" id="runePanel">
      <div class="glyph" id="glyph"></div>
      <div class="name" id="runeName"></div>
      <div class="sub" id="runeSub"></div>
      <div class="rule"></div>
      <div class="verse" id="verse"></div>
      <div class="rule"></div>
      <div class="meaning" id="meaning"></div>
      <div class="source" id="runeSource"></div>
    </section>

    <section class="panel" id="deityPanel">
      <div class="name" id="deityName"></div>
      <div class="epithet" id="epithet"></div>
      <div class="domain" id="domain"></div>
      <div class="rule"></div>
      <div class="blurb" id="blurb"></div>
      <div class="brings" id="brings"></div>
      <div class="source" id="deitySource"></div>
    </section>

    <section class="panel" id="plantPanel">
      <div class="name" id="plantName"></div>
      <div class="epithet" id="plantFolk"></div>
      <div class="domain" id="plantSub"></div>
      <div class="rule"></div>
      <div class="verse" id="plantVerse"></div>
      <div class="rule"></div>
      <div class="meaning" id="plantBody"></div>
      <div class="ties" id="plantTies"></div>
      <div class="source" id="plantWhen"></div>
      <div class="caution" id="plantCaution"></div>
    </section>

    <div class="foot" id="foot"></div>
    <div class="site">theblackthorngrove.life</div>
  </main>
  </div>

<script src="data.js"></script>
<script src="embed_css.js"></script>
<script>
document.getElementById('embedCss').textContent = EMBED_CSS;

const params = new URLSearchParams(location.search);
const mode = params.get('mode') || 'rune';      // 'rune' | 'deity' | 'plant'
const dateStr = params.get('date');              // YYYY-MM-DD, else today

let d;
if (dateStr) {
  const [y,m,day] = dateStr.split('-').map(Number);
  d = new Date(y, m-1, day);                     // local midnight in browser tz
} else {
  const n = new Date();
  d = new Date(n.getFullYear(), n.getMonth(), n.getDate());
}

// Identical math to the Grove Hearth embed's dayIndex()
// An explicit ?idx=N overrides the date seed (used by the deck/reel renderer)
const idxParam = params.get('idx');
function dayIndex(len){
  if (idxParam !== null) return ((parseInt(idxParam,10)%len)+len)%len;
  const days = Math.floor(d.getTime()/86400000);
  return ((days%len)+len)%len;
}

document.getElementById('date').textContent =
  d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

const KICKERS = {
  rune:  'The Blackthorn Grove · Rune of the Day',
  deity: 'The Blackthorn Grove · Deity of the Day',
  plant: 'The Blackthorn Grove · Plant of the Day'
};
const FOOTS = {
  rune:  'The runes speak when the silence is true',
  deity: 'Honor the old ones; walk your own road',
  plant: 'Know the plant before you ask it for anything'
};

document.getElementById('runePanel').classList.toggle('active', mode==='rune');
document.getElementById('deityPanel').classList.toggle('active', mode==='deity');
document.getElementById('plantPanel').classList.toggle('active', mode==='plant');
document.getElementById('kicker').textContent = KICKERS[mode];
document.getElementById('foot').textContent = FOOTS[mode];

let drawnName = '';
if (mode === 'rune') {
  const r = RUNES[dayIndex(RUNES.length)];
  drawnName = r.name;
  document.getElementById('glyph').textContent = r.g;
  document.getElementById('runeName').textContent = r.name;
  document.getElementById('runeSub').textContent = r.sub;
  document.getElementById('verse').innerHTML = r.verse.map(l=>'<span>'+l+'</span>').join('');
  document.getElementById('meaning').textContent = r.meaning;
  document.getElementById('runeSource').innerHTML = r.source ? '<b>Verse from:</b> '+r.source : '';
} else if (mode === 'deity') {
  const dd = DEITIES[dayIndex(DEITIES.length)];
  drawnName = dd.name;
  document.getElementById('deityName').textContent = dd.name;
  document.getElementById('epithet').textContent = dd.epithet;
  document.getElementById('domain').textContent = dd.domain;
  document.getElementById('blurb').textContent = dd.blurb;
  document.getElementById('brings').innerHTML = '<b>Brings:</b> '+dd.brings;
  document.getElementById('deitySource').innerHTML = '<b>Found in:</b> '+dd.source;
} else {
  const p = PLANTS[dayIndex(PLANTS.length)];
  drawnName = p.name;
  document.getElementById('plantName').textContent = p.name;
  document.getElementById('plantFolk').textContent = p.folk;
  document.getElementById('plantSub').textContent = p.sub;
  document.getElementById('plantVerse').innerHTML = p.quote ? '<span>' + p.quote + '</span>' : '';
  document.getElementById('plantBody').textContent = p.body;
  const ties = [];
  if (p.runes) ties.push('<b>Runes:</b> ' + p.runes);
  if (p.deities) ties.push('<b>Walks with:</b> ' + p.deities);
  if (p.uses) ties.push('<b>Works for:</b> ' + p.uses);
  document.getElementById('plantTies').innerHTML = ties.join('<br>');
  document.getElementById('plantWhen').innerHTML = p.when ? '<b>Best worked:</b> ' + p.when : '';
  document.getElementById('plantCaution').innerHTML =
    p.caution ? '<b>Care</b><br>' + p.caution : '';
}

// Scale the card to fit the 540x675 frame with margin
const card = document.querySelector('.card');
const fit = () => {
  const w = card.offsetWidth, h = card.offsetHeight;
  const s = Math.min(510/w, 645/h, 1.28);
  card.style.transform = 'scale('+s+')';
  document.title = JSON.stringify({name:drawnName, scale:s, w, h});
};
requestAnimationFrame(fit);
</script>
</body>
</html>
